# Codemagic CI/CD configuration for iOS build
# Documentation: https://docs.codemagic.io/yaml-quick-start/

workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.dijlah.alamalislam"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa and automatic versioning
        script: |
          flutter build ipa --release \
            --build-name=2.0.2 \
            --build-number=$((${BUILD_NUMBER:-1} + 16)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      # To automatically publish to App Store Connect / TestFlight,
      # configure the app_store_connect section or use Codemagic UI.
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
