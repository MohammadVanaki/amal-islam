workflows:
  ios-release:
    name: iOS Release IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - apple_credentials # نام گروه متغیرهایی که موقع Save کردن API Key ساختی
      flutter: 3.47.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Set up code signing
        script: |
          # کدمجیک گواهی توزیع و پروفایل اپ‌استور را به صورت خودکار مچ می‌کند
          xcode-project use-profiles
      - name: Force iOS 15.0 Deployment Target
        script: |
          # اطمینان از تنظیم تارگت ۱۵.۰ در فایل اصلی پروژه برای سازگاری با Swift Packageها
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} \;
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} \;
          find ios -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 11.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} \;
      - name: Flutter build IPA
        script: |
          # ساخت رسمی فایل IPA بدون تداخل کوکوآپادز
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
